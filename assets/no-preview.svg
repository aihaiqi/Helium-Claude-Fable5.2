  </defs>
  <rect width="680" height="383" fill="url(#bg)"/>
  <rect width="680" height="383" fill="url(#glow)"/>

  <!-- corner stars -->
  <g fill="#f2f0ea">
    <circle cx="60" cy="52" r="1.5" opacity="0.7"/>
    <circle cx="620" cy="70" r="1.2" opacity="0.5"/>
