<svg xmlns="http://www.w3.org/2000/svg" width="680" height="383" viewBox="0 0 680 383">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#6b4eff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#6b4eff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6b4eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f17"/>
      <stop offset="1" stop-color="#0a0a0f"/>
