  </g>

  <!-- open arrow icon -->
  <g transform="translate(316,120)" stroke="#6b4eff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 36 L 36 12"/>
    <path d="M 16 12 L 36 12 L 36 32"/>
  </g>

  <!-- texts -->
  <text x="340" y="208" text-anchor="middle" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" font-size="34" font-weight="600" fill="#f2f0ea">Open to play ↗</text>
  <text x="340" y="248" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" letter-spacing="2" fill="#5b5a68">no preview in the original post</text>
