<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Fable 5.2 可玩作品画廊 · curated by Helium</title>
<meta name="description" content="Claude Fable 5.2 发布 48 小时内，人们做出的 57 个可立即打开体验的作品 + 61 个视频演示，全部经人工逐条打开验证。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;
  --bg2:#0f0f17;
  --ink:#f2f0ea;
  --muted:#9b99a8;
  --faint:#5b5a68;
  --line:rgba(242,240,234,.08);
  --accent:#6b4eff;
  --accent2:#ff7a59;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --disp:'Space Grotesk','Noto Sans SC',sans-serif;
  --body:'Noto Sans SC','Space Grotesk',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--accent);color:#fff}
a{color:inherit;text-decoration:none}
img{display:block}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#stars{position:absolute;inset:0;width:100%;height:100%}
.hero-glow{position:absolute;width:70vw;height:70vw;max-width:900px;max-height:900px;left:50%;top:-30%;transform:translateX(-50%);background:radial-gradient(circle,rgba(107,78,255,.28) 0%,rgba(107,78,255,.06) 45%,transparent 70%);pointer-events:none}
.hero-glow.b{left:85%;top:35%;background:radial-gradient(circle,rgba(255,122,89,.18) 0%,transparent 65%)}
.hero-inner{position:relative;z-index:2;padding:0 6vw 8vh}
.hero-kicker{font-family:var(--mono);font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--accent2);margin-bottom:24px;display:flex;align-items:center;gap:12px}
.hero-kicker::before{content:'';width:32px;height:1px;background:var(--accent2)}
h1.hero-title{font-family:var(--disp);font-weight:700;font-size:clamp(52px,9.5vw,150px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
h1 .thin{font-weight:400;color:var(--muted)}
h1 .accent{color:var(--accent);font-style:italic}
.hero-sub{max-width:620px;margin-top:28px;color:var(--muted);font-size:clamp(15px,1.4vw,18px)}
.hero-sub b{color:var(--ink);font-weight:500}
.hero-stats{display:flex;flex-wrap:wrap;gap:0;margin-top:48px;border-top:1px solid var(--line)}
.hstat{padding:20px 40px 4px 0;margin-right:40px;border-right:1px solid var(--line);padding-right:40px}
.hstat:last-child{border-right:none}
.hstat .n{font-family:var(--disp);font-size:clamp(28px,3.4vw,44px);font-weight:700;line-height:1}
.hstat .n em{font-style:normal;color:var(--accent)}
.hstat .l{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.scroll-hint{position:absolute;right:6vw;bottom:8vh;z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--faint);writing-mode:vertical-rl;display:flex;align-items:center;gap:12px}
.scroll-hint::after{content:'';width:1px;height:56px;background:linear-gradient(var(--faint),transparent);animation:drip 2.2s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}55%{transform:scaleY(1);transform-origin:top}56%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1500px;margin:0 auto;padding:0 6vw;display:flex;align-items:center;gap:28px;height:60px}
.brand{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--accent)}
.nav-links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);padding:6px 12px;border-radius:99px;white-space:nowrap;transition:.25s}
.nav-links a:hover{color:var(--ink)}
.nav-links a.on{background:var(--accent);color:#fff}
.nav-right{display:flex;align-items:center;gap:14px;white-space:nowrap}
.lang-btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;background:none;border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:99px;cursor:pointer;transition:.25s}
.lang-btn:hover{border-color:var(--accent);color:var(--ink)}
.search-box{position:relative}
.search-box input{background:rgba(242,240,234,.05);border:1px solid var(--line);border-radius:99px;color:var(--ink);font-family:var(--mono);font-size:12px;padding:7px 14px 7px 32px;width:170px;outline:none;transition:.3s}
.search-box input:focus{border-color:var(--accent);width:230px;background:rgba(242,240,234,.08)}
.search-box::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:14px}

/* ---------- sections ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:0 6vw}
section.block{padding:110px 0 30px}
.sec-head{display:flex;align-items:baseline;gap:24px;margin-bottom:14px;flex-wrap:wrap}
.sec-index{font-family:var(--mono);font-size:13px;color:var(--accent2);letter-spacing:.2em}
h2.sec-title{font-family:var(--disp);font-weight:700;font-size:clamp(34px,4.6vw,62px);letter-spacing:-.02em;line-height:1;text-transform:uppercase}
.sec-meta{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.15em;margin-left:auto}
.sec-desc{color:var(--muted);max-width:560px;margin-bottom:52px;font-size:15px}
.rule{height:1px;background:var(--line);margin-bottom:0}

/* ---------- grid & cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:56px 28px;padding-top:56px}
.card{position:relative;opacity:0;transform:translateY(36px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}
.card.in{opacity:1;transform:none}
.card.hidden{display:none}
.card a.card-link{display:block}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:6px;background:var(--bg2)}
.thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.92);transition:transform .8s cubic-bezier(.2,.6,.2,1),filter .5s}
.card:hover .thumb img{transform:scale(1.06);filter:saturate(1.1)}
.thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,10,15,.55));opacity:.8;transition:.4s}
.card:hover .thumb::after{opacity:.4}
.rank{position:absolute;top:12px;left:12px;z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.1em;background:rgba(10,10,15,.72);backdrop-filter:blur(6px);padding:4px 10px;border-radius:99px;color:var(--muted);border:1px solid var(--line)}
.likes{position:absolute;top:12px;right:12px;z-index:2;font-family:var(--mono);font-size:11px;background:rgba(10,10,15,.72);backdrop-filter:blur(6px);padding:4px 10px;border-radius:99px;color:var(--accent2);border:1px solid rgba(255,122,89,.25)}
.likes::before{content:'♥ '}
.play{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;opacity:0;transition:.35s}
.card:hover .play{opacity:1}
.play span{width:64px;height:64px;border-radius:50%;background:rgba(242,240,234,.94);color:#0a0a0f;display:flex;align-items:center;justify-content:center;font-size:20px;transform:scale(.7);transition:.35s cubic-bezier(.34,1.56,.64,1)}
.card:hover .play span{transform:scale(1)}
.play svg{margin-left:3px}
.card-body{padding:18px 2px 0}
.card-title{font-family:var(--disp);font-weight:600;font-size:17px;line-height:1.35;letter-spacing:-.01em}
.card-title a:hover{color:var(--accent)}
.card-title .zh{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-top:4px}
.card-desc{font-size:13px;color:var(--muted);margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--faint);flex-wrap:wrap}
.card-meta .sep{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.card-meta a{color:var(--muted);transition:.2s}
.card-meta a:hover{color:var(--ink)}
.xlink{color:var(--faint)}
.xlink:hover{color:var(--accent2)!important}
.extra-links{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.extra-links a{font-size:12px;color:var(--faint);transition:.2s}
.extra-links a:hover{color:var(--accent)}
.extra-links a::before{content:'↳ ';color:var(--accent)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(5,5,10,.9);backdrop-filter:blur(10px)}
.modal.open{display:flex}
.modal-box{position:relative;max-width:min(1100px,92vw);max-height:90vh;width:100%}
.modal-box video{width:100%;max-height:82vh;border-radius:8px;background:#000}
.modal-close{position:absolute;top:-46px;right:0;font-family:var(--mono);font-size:12px;letter-spacing:.15em;color:var(--muted);background:none;border:1px solid var(--line);border-radius:99px;padding:7px 18px;cursor:pointer;transition:.25s}
.modal-close:hover{color:var(--ink);border-color:var(--ink)}
.modal-cap{margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap;gap:10px}
.modal-cap a{color:var(--accent2)}

/* ---------- footer ---------- */
footer{margin-top:120px;border-top:1px solid var(--line);padding:64px 0 48px}
.foot-inner{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap}
.foot-title{font-family:var(--disp);font-weight:700;font-size:22px}
.foot-title span{color:var(--accent)}
.foot-note{color:var(--faint);font-size:13px;max-width:440px;margin-top:12px}
.foot-credit{color:var(--muted);font-size:12px;max-width:440px;margin-top:6px;font-family:var(--mono)}
.foot-links{display:flex;gap:32px;font-family:var(--mono);font-size:12px}
.foot-links a{color:var(--muted);display:block;margin-bottom:10px;transition:.2s}
.foot-links a:hover{color:var(--ink)}
.foot-bottom{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);flex-wrap:wrap;gap:12px}

.empty{padding:80px 0;text-align:center;color:var(--faint);font-family:var(--mono);font-size:13px;letter-spacing:.1em;display:none}

@media (max-width:760px){
  .hstat{padding-right:24px;margin-right:24px}
  .scroll-hint{display:none}
  .nav-right .search-box input{width:120px}
  .nav-right .search-box input:focus{width:150px}
  .grid{grid-template-columns:1fr 1fr;gap:36px 14px}
  .card-title{font-size:14px}
  .card-desc{display:none}
  section.block{padding:70px 0 20px}
}
@media (max-width:480px){
  .grid{grid-template-columns:1fr}
  .card-desc{display:-webkit-box}
}
</style>
</head>
<body>

<!-- ================= HERO ================= -->
<header class="hero" id="top">
  <canvas id="stars"></canvas>
  <div class="hero-glow"></div>
  <div class="hero-glow b"></div>
  <div class="hero-inner">
    <div class="hero-kicker" data-i18n="kicker">Claude Fable 5.2 · 发布于 2026-11-09</div>
    <h1 class="hero-title" id="heroTitle">
      <span class="thin">Fable</span><br>
      <span class="accent">5.2</span>
    </h1>
    <p class="hero-sub" data-i18n="sub"></p>
    <div class="hero-stats">
      <div class="hstat"><div class="n"><em>57</em></div><div class="l" data-i18n="s1">可立即体验</div></div>
      <div class="hstat"><div class="n"><em>61</em></div><div class="l" data-i18n="s2">视频演示</div></div>

</header>

<!-- ================= NAV ================= -->
<nav class="nav" id="nav">
  <div class="nav-inner">

    <div class="nav-links" id="navLinks"></div>
    <div class="nav-right">
      <div class="search-box"><input id="search" type="text" data-i18n-ph="search" placeholder="搜索作品 / 作者…"></div>
      <button class="lang-btn" id="langBtn">EN</button>
    </div>
  </div>
</nav>

<div id="sections"></div>

<div class="wrap"><div class="empty" id="empty" data-i18n="empty">没有匹配的作品 — 试试别的关键词</div></div>

<!-- ================= FOOTER ================= -->
<footer>
  <div class="wrap">
    <div class="foot-inner">
      <div>
        <div class="foot-title">FABLE<span>·</span>5.2</div>
        <p class="foot-note" data-i18n="footNote"></p>
        <p class="foot-credit" data-i18n="footCredit"></p>
      </div>
      <div class="foot-links">
        <div>
          <a href="#top" data-i18n="fTop">回到顶部</a>
          <a href="https://github.com/kingll2026/helium-fable-5.2" target="_blank" rel="noopener">GitHub ↗</a>
        </div>
        <div>
          <a href="README.md">README.md</a>
          <a href="CONTRIBUTING.md">CONTRIBUTING.md</a>
        </div>
      </div>
    </div>
    <div class="foot-bottom">
      <span data-i18n="footLic">内容遵循 CC0-1.0 · 链接验证于 2026-11-10</span>
      <span>NOT AFFILIATED WITH ANTHROPIC</span>
    </div>
  </div>
</footer>

<!-- ================= MODAL ================= -->
<div class="modal" id="modal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" data-i18n="close">关闭 ESC</button>
    <video id="modalVideo" controls autoplay playsinline></video>
    <div class="modal-cap">
      <span id="modalTitle"></span>
      <a id="modalPost" target="_blank" rel="noopener" data-i18n="srcPost">查看原帖 ↗</a>
    </div>
  </div>
</div>

<script src="data/works.js"></script>
<script>
/* ================= i18n ================= */
const I18N = {
  zh: {
    kicker: 'Claude Fable 5.2 · 发布于 2026-11-09',
    sub: '发布后 48 小时内，人们用 Fable 5.2 做出的<b>可以真正打开来玩</b>的游戏、3D 世界与网页。每一条链接都在 2026-11-10 被人工打开验证过。',
    s1: '可立即体验', s2: '视频演示', s3: '全部人工验证',
    search: '搜索作品 / 作者…',
    empty: '没有匹配的作品 — 试试别的关键词',
    close: '关闭 ESC', srcPost: '查看原帖 ↗',
    footNote: '一个由社区维护的作品精选列表。每条作品都附上 GIF 预览、作者署名，并链接回原始帖子。觉得有用的话，欢迎点个 Star — 新作品仍在每天出现。',
    footCredit: '策展人：Helium · Fork 自 awesome-fable-5.2',
    footLic: '内容遵循 CC0-1.0 · 链接验证于 2026-11-10',
    fTop: '回到顶部',
    open: '打开作品', video: '播放视频',
    secNames: { '游戏':'游戏', '3D 场景':'3D 世界 & 场景', '网页与工具':'网页 & 工具', '视频与动画（附源码）':'动画 & 短片（附源码）', 'video-only':'仅视频演示' },
    secDesc: {
      '游戏':'22 个可以直接开玩的游戏 — 从第一人称射击到整个可破坏的地球。',
      '3D 场景':'12 个可漫游的 3D 世界与实时渲染场景。',
      '网页与工具':'15 个实用或惊艳的网页应用与工具。',
      '视频与动画（附源码）':'8 个附完整源码的动画与短片项目。',
      'video-only':'61 个只有视频演示的热门作品 — 点击卡片即可直接播放。'
    }
  },
  en: {
    kicker: 'Claude Fable 5.2 · Shipped 2026-11-09',
    sub: 'Within 48 hours of release, people built games, 3D worlds and web pages with Fable 5.2 that <b>you can actually open and play</b>. Every link was opened and hand-checked on 2026-11-10.',
    s1: 'Live works', s2: 'Video demos', s3: 'Links hand-checked',
    search: 'Search works / authors…',
    empty: 'No matching works — try another keyword',
    close: 'CLOSE ESC', srcPost: 'View original post ↗',
    footNote: 'A community-curated list of works made with Claude Fable 5.2. Every entry ships a GIF preview, credits its creator and links back to the original post. If this helps, a star keeps it coming.',
    footCredit: 'Curated by Helium · Forked from awesome-fable-5.2',
    footLic: 'Content under CC0-1.0 · Links checked 2026-11-10',
    fTop: 'Back to top',
    open: 'Open work', video: 'Play video',
    secNames: { '游戏':'Games', '3D 场景':'3D Worlds & Scenes', '网页与工具':'Web Pages & Tools', '视频与动画（附源码）':'Animation & Film (with source)', 'video-only':'Video-only Demos' },
    secDesc: {
      '游戏':'22 games you can play right now — from a first-person shooter to a destructible Earth.',
      '3D 场景':'12 explorable 3D worlds and real-time rendered scenes.',
      '网页与工具':'15 useful or stunning web apps and tools.',
      '视频与动画（附源码）':'8 animation and film projects with full source included.',
      'video-only':'61 popular works that only exist as video — click a card to play inline.'
    }
  }
};
let lang = localStorage.getItem('fable-lang') || 'zh';
const t = k => I18N[lang][k];
const secName = s => I18N[lang].secNames[s] || s;

/* ================= data ================= */
const DATA = window.WORKS_DATA;
const SECTIONS = [...new Set(DATA.map(w => w.section))];
const LIVE = DATA.filter(w => w.section !== 'video-only');
const MOST_LOVED = [...LIVE].sort((a,b)=>b.likes-a.likes).slice(0,6);

/* ================= render sections ================= */
const wrap = document.getElementById('sections');
let secNo = 0;

function fmtLikes(n){ return n>=1000 ? (n/1000).toFixed(1).replace(/\.0$/,'')+'k' : n; }

function cardHTML(w, idx, inMostLoved){
  const isVO = w.section === 'video-only';
  const title = lang==='zh' && w.title_zh ? w.title_zh : w.title;
  const zh = lang==='zh' ? '' : (w.title_zh || '');
  const desc = lang==='zh' ? (w.description_zh || w.description) : w.description;
  const playBtn = (isVO || (w.videos && w.videos.length))
    ? `<div class="play" data-vid="${idx}"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></div>` : '';
  const openLink = w.url
    ? `<a class="card-link" href="${w.url}" target="_blank" rel="noopener">` : `<div class="card-link" style="cursor:default">`;
  const closeLink = w.url ? `</a>` : `</div>`;
  const extras = (w.extra_links||[]).map(l=>{
    const sp = l.indexOf(' http'); const txt = sp>0?l.slice(0,sp):l; const href = sp>0?l.slice(sp+1):'#';
    return `<a href="${href}" target="_blank" rel="noopener">${escapeHtml(txt)}</a>`;
  }).join('');
  return `
  <article class="card" data-idx="${idx}" data-search="${escapeHtml((w.title+' '+(w.title_zh||'')+' '+w.author+' '+(w.description||'')+' '+(w.description_zh||'')).toLowerCase())}">
    ${openLink}
      <div class="thumb">
        <span class="rank">#${w.id}</span>
        ${w.likes?`<span class="likes">${fmtLikes(w.likes)}</span>`:''}
        <img src="${w.preview}" alt="${escapeHtml(title)}" loading="lazy">
        ${playBtn}
      </div>
      <div class="card-body">
        <h3 class="card-title">${escapeHtml(title)}${zh?`<span class="zh">${escapeHtml(zh)}</span>`:''}</h3>
        ${desc?`<p class="card-desc">${escapeHtml(desc)}</p>`:''}
        <div class="card-meta">
          <a href="https://x.com/${w.author}" target="_blank" rel="noopener">@${escapeHtml(w.author)}</a>
          <span class="sep"></span>
          ${w.post?`<a class="xlink" href="${w.post}" target="_blank" rel="noopener">𝕏 ${lang==='zh'?'原帖':'post'}</a>`:''}
        </div>
        ${extras?`<div class="extra-links">${extras}</div>`:''}
      </div>
    ${closeLink}
  </article>`;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function sectionHTML(id, title, desc, items){
  secNo++;
  return `
  <section class="block" id="${id}">
    <div class="wrap">
      <div class="sec-head">
        <span class="sec-index">0${secNo}</span>
        <h2 class="sec-title">${title}</h2>
        <span class="sec-meta">${items.length} ${lang==='zh'?'件作品':'WORKS'}</span>
      </div>
      <p class="sec-desc">${desc}</p>
      <div class="grid">${items.map(w=>cardHTML(w, DATA.indexOf(w))).join('')}</div>
      <div class="rule" style="margin-top:80px"></div>
    </div>
  </section>`;
}

function render(){
  secNo = 0;
  const ml = { id:'most-loved', title: lang==='zh'?'最受欢迎':'Most Loved',
    desc: lang==='zh'?'点赞数最高的六个在线作品。':'The six most-liked live works.' };
  let html = sectionHTML(ml.id, ml.title, ml.desc, MOST_LOVED);
  SECTIONS.forEach(s=>{
    html += sectionHTML('sec-'+s, secName(s), I18N[lang].secDesc[s], DATA.filter(w=>w.section===s));
  });
  wrap.innerHTML = html;

  // nav links
  const navNames = [ml, ...SECTIONS.map(s=>({id:'sec-'+s, title:secName(s)}))];
  document.getElementById('navLinks').innerHTML =
    navNames.map(n=>`<a href="#${n.id}" data-sec="${n.id}">${n.title}</a>`).join('');

  applyI18n();
  bindObservers();
  filterCards();
}

/* ================= i18n apply ================= */
function applyI18n(){
  document.documentElement.lang = lang==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v = t(el.dataset.i18n); if(v!==undefined) el.innerHTML = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    el.placeholder = t(el.dataset.i18nPh);
  });
  document.getElementById('langBtn').textContent = lang==='zh'?'EN':'中文';
}

/* ================= scroll spy ================= */
const spy = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      document.querySelectorAll('#navLinks a').forEach(a=>a.classList.toggle('on', a.dataset.sec===e.target.id));
    }
  });
},{rootMargin:'-20% 0px -70% 0px'});

/* ================= reveal ================= */
const reveal = new IntersectionObserver(entries=>{
  entries.forEach((e)=>{
    if(e.isIntersecting){ e.target.classList.add('in'); reveal.unobserve(e.target); }
  });
},{rootMargin:'0px 0px -8% 0px'});

function bindObservers(){
  document.querySelectorAll('section.block').forEach(s=>spy.observe(s));
  document.querySelectorAll('.card').forEach(c=>reveal.observe(c));
  // video play buttons
  document.querySelectorAll('.play').forEach(p=>{
    p.addEventListener('click', ev=>{
      ev.preventDefault(); ev.stopPropagation();
      openModal(DATA[+p.dataset.vid]);
    });
  });
}

/* ================= modal ================= */
const modal=document.getElementById('modal'), mv=document.getElementById('modalVideo');
function openModal(w){
  const v = w.videos && w.videos[0];
  if(!v) return;
  mv.src = v.url;
  document.getElementById('modalTitle').textContent = lang==='zh'&&w.title_zh?w.title_zh:w.title;
  document.getElementById('modalPost').href = w.post || '#';
  modal.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  modal.classList.remove('open');
  mv.pause(); mv.removeAttribute('src'); mv.load();
  document.body.style.overflow='';
}
document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ================= search ================= */
document.getElementById('search').addEventListener('input', filterCards);
function filterCards(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let any=false;
  document.querySelectorAll('.card').forEach(c=>{
    const hit = !q || c.dataset.search.includes(q);
    c.classList.toggle('hidden', !hit);
    if(hit) any=true;
  });
  document.querySelectorAll('section.block').forEach(s=>{
    const vis = [...s.querySelectorAll('.card')].some(c=>!c.classList.contains('hidden'));
    s.style.display = vis ? '' : 'none';
  });
  document.getElementById('empty').style.display = any?'none':'block';
}

/* ================= lang toggle ================= */
document.getElementById('langBtn').addEventListener('click', ()=>{
  lang = lang==='zh'?'en':'zh';
  localStorage.setItem('fable-lang', lang);
  render();
});

/* ================= starfield ================= */
const cv=document.getElementById('stars'), cx=cv.getContext('2d');
let stars=[], W, H;
function resize(){
  W=cv.width=cv.offsetWidth*devicePixelRatio; H=cv.height=cv.offsetHeight*devicePixelRatio;
  stars=Array.from({length:Math.min(180, W/10)}, ()=>({
    x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+.3,
    vy:Math.random()*.15+.03, a:Math.random()*.6+.2, tw:Math.random()*Math.PI*2
  }));
}
resize(); addEventListener('resize', resize);
(function loop(t){
  cx.clearRect(0,0,W,H);
  stars.forEach(s=>{
    s.y+=s.vy; if(s.y>H) s.y=-4;
    const tw = s.a*(0.6+0.4*Math.sin(t/900+s.tw));
    cx.globalAlpha=tw;
    cx.fillStyle = Math.random()<.002?'#ff7a59':'#c9c6ff';
    cx.beginPath(); cx.arc(s.x,s.y,s.r*devicePixelRatio,0,7); cx.fill();
  });
  requestAnimationFrame(loop);
})(0);

render();
</script>
</body>
</html>
